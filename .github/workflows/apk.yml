name: APK Android (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/build-apk.sh"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    name: Construire l'APK de démonstration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - run: npm ci

      # ANDROID_HOME est déjà défini sur les machines ubuntu-latest.
      - name: Plateforme Android 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Construire l'APK
        run: GRADLE=gradle ./scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DigiStore-demo-apk
          path: dist/DigiStore-demo.apk
          retention-days: 30
