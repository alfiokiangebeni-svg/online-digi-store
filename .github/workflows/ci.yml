name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité, build et budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript strict)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Budget de poids (JS < 120 Ko sur l'accueil)
        run: npm run budget

      - name: Lighthouse CI (mobile, Slow 4G, CPU ×4)
        run: npx -y @lhci/cli@0.15.1 autorun

      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports
          retention-days: 14
