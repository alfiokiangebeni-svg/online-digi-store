plugins {
    id "com.android.application"
}

android {
    namespace "cd.digistore.app"
    compileSdk 35

    defaultConfig {
        applicationId "cd.digistore.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Le site exporté (out-apk/) est copié dans assets/www par scripts/build-apk.sh.
    androidResources {
        noCompress += ["woff2"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
